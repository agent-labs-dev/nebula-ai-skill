name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Validate Agent Skill
        run: uvx --from skills-ref agentskills validate ./nebula-ai
      - name: Check shell wrapper
        run: sh -n nebula-ai/scripts/nebula.sh
