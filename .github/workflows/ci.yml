name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Validate Agent Skill
        run: uvx --from skills-ref==0.1.1 agentskills validate ./nebula-ai

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check shell scripts
        run: |
          git ls-files -z '*.sh' | xargs -0 -r shellcheck
          git ls-files -z '*.sh' | xargs -0 -r -n 1 sh -n

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Check CLI examples and public text
        run: python3 tools/check_skill.py

  cli-surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Check pinned CLI surface
        run: tools/snapshot-cli.sh --check

  # A lagging pin fails only pull requests that change the skill. Elsewhere it
  # is a warning: the CLI drift workflow already tracks it in an issue.
  cli-latest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Check latest CLI version
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          pin=$(cat nebula-ai/cli-version)
          latest=$(npm view nebula-ai dist-tags.latest)
          if [ "$latest" = "$pin" ]; then
            printf 'nebula-ai %s is current.\n' "$pin"
            exit 0
          fi
          level=warning
          if [ -n "$BASE_SHA" ] && [ -n "$(git diff --name-only "$BASE_SHA" HEAD -- nebula-ai/)" ]; then
            level=error
          fi
          printf '::%s::nebula-ai %s is available; this repository supports %s. Follow CONTRIBUTING.md "Updating the supported CLI version".\n' "$level" "$latest" "$pin"
          [ "$level" = warning ]
