name: Staging promotion

on:
  push:
    branches: [main, cb/staging]
  pull_request:
    branches: [main, cb/staging]
    types: [opened, closed, reopened, synchronize, ready_for_review, converted_to_draft, labeled, unlabeled]
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      verified_staging_sha:
        description: Exact cb/staging SHA that passed composed /dev verification
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: staging-promotion-${{ github.repository }}
  cancel-in-progress: false

jobs:
  maintain:
    if: github.event_name != 'pull_request' || github.base_ref == 'cb/staging'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      statuses: write
    steps:
      - name: Mint automation token
        id: app-token
        if: env.AUTOMATION_APP_ID != '' && env.AUTOMATION_PRIVATE_KEY != ''
        env:
          AUTOMATION_APP_ID: ${{ secrets.AGENT_LABS_BOT_APP_ID }}
          AUTOMATION_PRIVATE_KEY: ${{ secrets.AGENT_LABS_BOT_PRIVATE_KEY }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ env.AUTOMATION_APP_ID }}
          private-key: ${{ env.AUTOMATION_PRIVATE_KEY }}

      - name: Maintain promotion tracker
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          REQUESTED_VERIFICATION_SHA: ${{ inputs.verified_staging_sha || '' }}
        shell: bash
        run: |
          set -euo pipefail

          repository="${GITHUB_REPOSITORY}"
          main_sha="$(gh api "repos/${repository}/branches/main" --jq '.commit.sha')"
          staging_sha="$(gh api "repos/${repository}/branches/cb%2Fstaging" --jq '.commit.sha')"
          comparison="$(gh api "repos/${repository}/compare/main...cb/staging")"
          initial_behind="$(jq -r '.behind_by' <<<"${comparison}")"
          sync_result=not-needed
          if (( initial_behind > 0 )) && [[ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]]; then
            if gh api --method POST "repos/${repository}/merges" \
              -f base=cb/staging \
              -f head=main \
              -f commit_message="chore: synchronize main into staging" >/dev/null; then
              sync_result=merged
              main_sha="$(gh api "repos/${repository}/branches/main" --jq '.commit.sha')"
              staging_sha="$(gh api "repos/${repository}/branches/cb%2Fstaging" --jq '.commit.sha')"
              comparison="$(gh api "repos/${repository}/compare/main...cb/staging")"
            else
              sync_result=conflict-or-policy-blocked
            fi
          fi
          ahead="$(jq -r '.ahead_by' <<<"${comparison}")"
          behind="$(jq -r '.behind_by' <<<"${comparison}")"
          staging_date="$(jq -r '.commits[-1].commit.committer.date // empty' <<<"${comparison}")"
          staging_age_days=0
          if [[ -n "${staging_date}" ]]; then
            staging_age_days="$(( ($(date +%s) - $(date -d "${staging_date}" +%s)) / 86400 ))"
          fi
          task_prs="$(gh pr list --repo "${repository}" --base cb/staging --state open --json number --jq 'length')"
          promotion_number="$(gh pr list --repo "${repository}" --base main --head cb/staging --state open --json number --jq '.[0].number // empty')"

          gh label create composed-dev-verified --repo "${repository}" --color 0E8A16 \
            --description "Composed /dev verification passed for the current cb/staging SHA" --force

          if [[ -n "${promotion_number}" && ( "${GITHUB_EVENT_NAME}" == "push" || "${sync_result}" == "merged" ) ]]; then
            has_verification_label="$(gh pr view "${promotion_number}" --repo "${repository}" --json labels \
              --jq 'any(.labels[].name; . == "composed-dev-verified")')"
            if [[ "${has_verification_label}" == "true" ]]; then
              gh pr edit "${promotion_number}" --repo "${repository}" --remove-label composed-dev-verified
            fi
          fi
          requested_verification="${REQUESTED_VERIFICATION_SHA}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "${requested_verification}" ]]; then
            if [[ -z "${promotion_number}" ]]; then
              echo "No open staging promotion PR exists." >&2
              exit 1
            fi
            if [[ "${requested_verification}" != "${staging_sha}" ]]; then
              echo "Verified SHA ${requested_verification} does not match current staging SHA ${staging_sha}." >&2
              exit 1
            fi
            if (( behind > 0 )); then
              echo "Staging must contain current main before composed verification is recorded." >&2
              exit 1
            fi
            gh api --method POST "repos/${repository}/statuses/${staging_sha}" \
              -f state=success \
              -f context=composed-dev-verification \
              -f description="Composed /dev verification passed" \
              -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
            gh pr edit "${promotion_number}" --repo "${repository}" --add-label composed-dev-verified
            gh pr comment "${promotion_number}" --repo "${repository}" \
              --body "Composed /dev verification recorded for \`${staging_sha}\` by \`${GITHUB_ACTOR}\`: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fi

          verified=false
          verification_state="$(gh api "repos/${repository}/commits/${staging_sha}/status" \
            --jq '[.statuses[] | select(.context == "composed-dev-verification")][0].state // "missing"')"
          [[ "${verification_state}" == "success" ]] && verified=true

          state=promotion-ready
          if (( ahead == 0 )); then
            state=empty
          elif (( staging_age_days >= 7 )); then
            state=stale
          elif (( behind > 0 )); then
            state=promotion-blocked
          elif (( task_prs > 0 )); then
            state=collecting
          elif [[ "${verified}" != "true" ]]; then
            state=promotion-blocked
          fi

          if (( ahead > 0 )) && [[ -z "${promotion_number}" ]]; then
            promotion_url="$(gh pr create --repo "${repository}" --base main --head cb/staging --draft \
              --title "chore: promote staging to main" \
              --body "Initializing automated staging promotion status.")"
            promotion_number="${promotion_url##*/}"
          fi

          if [[ -n "${promotion_number}" ]]; then
            body_file="$(mktemp)"
            {
              echo "## Automated staging promotion status"
              echo
              echo "**State:** \`${state}\`"
              echo
              echo "| Signal | Value |"
              echo "|---|---|"
              echo "| Main SHA | \`${main_sha}\` |"
              echo "| Staging SHA | \`${staging_sha}\` |"
              echo "| Staging divergence | ${ahead} ahead, ${behind} behind |"
              echo "| Automatic main sync | ${sync_result} |"
              echo "| Open task PRs targeting staging | ${task_prs} |"
              echo "| Composed /dev proof for current staging | ${verified} |"
              echo "| Latest staging commit time | ${staging_date:-unavailable} |"
              echo "| Staging age | ${staging_age_days} day(s) |"
              echo
              echo "A push to \`cb/staging\` invalidates composed verification. CI never merges or deploys."
              echo "Run the **Staging promotion** workflow with the exact verified staging SHA only after composed /dev health passes."
              echo
              echo "_Updated by [workflow run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})._"
            } >"${body_file}"
            gh pr edit "${promotion_number}" --repo "${repository}" --body-file "${body_file}"
            if [[ "${state}" == "promotion-ready" ]]; then
              gh pr ready "${promotion_number}" --repo "${repository}"
            else
              gh pr ready "${promotion_number}" --repo "${repository}" --undo || true
            fi
          fi

          {
            echo "## Staging status: ${state}"
            echo
            echo "- main: \`${main_sha}\`"
            echo "- staging: \`${staging_sha}\`"
            echo "- divergence: ${ahead} ahead, ${behind} behind"
            echo "- automatic main sync: ${sync_result}"
            echo "- task PRs: ${task_prs}"
            echo "- composed verification: ${verified}"
            echo "- promotion PR: ${promotion_number:-missing}"
          } >>"${GITHUB_STEP_SUMMARY}"

  promotion-gate:
    name: Staging promotion gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require synchronized, integrated, composed staging
        shell: bash
        run: |
          set -euo pipefail

          repository="${GITHUB_REPOSITORY}"
          if [[ "${GITHUB_HEAD_REF}" != "cb/staging" ]]; then
            echo "Not a staging promotion PR; gate is not applicable." >>"${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          comparison="$(gh api "repos/${repository}/compare/main...cb/staging")"
          staging_sha="$(gh api "repos/${repository}/branches/cb%2Fstaging" --jq '.commit.sha')"
          behind="$(jq -r '.behind_by' <<<"${comparison}")"
          task_prs="$(gh pr list --repo "${repository}" --base cb/staging --state open --json number --jq 'length')"
          verification_state="$(gh api "repos/${repository}/commits/${staging_sha}/status" \
            --jq '[.statuses[] | select(.context == "composed-dev-verification")][0].state // "missing"')"

          failures=()
          (( behind == 0 )) || failures+=("cb/staging is ${behind} commit(s) behind main")
          (( task_prs == 0 )) || failures+=("${task_prs} task PR(s) still target cb/staging")
          [[ "${verification_state}" == "success" ]] || failures+=("composed /dev verification is missing or stale")

          if (( ${#failures[@]} > 0 )); then
            printf '%s\n' "${failures[@]}" >&2
            exit 1
          fi

          echo "Staging is synchronized, fully integrated, and composed-verified." >>"${GITHUB_STEP_SUMMARY}"
