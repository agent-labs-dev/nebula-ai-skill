name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Validate Agent Skill
        run: uvx --from skills-ref==0.1.1 agentskills validate ./nebula-ai

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check shell scripts
        run: |
          git ls-files -z '*.sh' | xargs -0 -r shellcheck
          git ls-files -z '*.sh' | xargs -0 -r -n 1 sh -n

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Test wrapper
        run: sh tests/test_wrapper.sh
      - name: Check CLI examples and public text
        if: ${{ !cancelled() }}
        run: python3 tools/check_skill.py

  cli-surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Check pinned CLI surface
        run: tools/snapshot-cli.sh --check

  cli-latest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Check latest CLI version
        run: |
          pin=$(cat nebula-ai/cli-version)
          latest=$(npm view nebula-ai dist-tags.latest)
          if [ "$latest" != "$pin" ]; then
            printf '::error::nebula-ai %s is available; this repository supports %s. Follow CONTRIBUTING.md "Updating the supported CLI version".\n' "$latest" "$pin"
            exit 1
          fi
          printf 'nebula-ai %s is current.\n' "$pin"
